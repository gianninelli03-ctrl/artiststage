<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA theme -->
    <meta name="theme-color" content="#FF007A" />
    <meta name="background-color" content="#09090B" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArtistStage" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO / Open Graph -->
    <meta name="description" content="La piattaforma per artisti emergenti. Scopri talenti, vai in Live e monetizza la tua musica." />
    <meta property="og:title" content="ArtistStage" />
    <meta property="og:description" content="La piattaforma per artisti emergenti." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Unbounded:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>ArtistStage | Piattaforma per Artisti Emergenti</title>

    <script>
      // Capture beforeinstallprompt early, before React mounts
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
      });

      window.addEventListener("error", function(e) {
        if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
          e.stopImmediatePropagation(); e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>Abilita JavaScript per usare ArtistStage.</noscript>
    <div id="root"></div>
  </body>
</html>
